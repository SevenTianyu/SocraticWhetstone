<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socratic Whetstone Gemini Gem Helper</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17202a;
        background: #f7f4ee;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        background: #fffaf1;
        border: 1px solid #d8cbb8;
        border-radius: 8px;
        box-shadow: 0 18px 60px rgba(32, 26, 18, 0.12);
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(26px, 4vw, 40px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 18px;
        color: #435160;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0;
      }

      button,
      a.button {
        appearance: none;
        border: 1px solid #1d4ed8;
        border-radius: 6px;
        background: #1d4ed8;
        color: white;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      button.secondary,
      a.button.secondary {
        background: transparent;
        color: #1d4ed8;
      }

      textarea {
        width: 100%;
        min-height: 280px;
        box-sizing: border-box;
        resize: vertical;
        border: 1px solid #c8bda9;
        border-radius: 6px;
        padding: 14px;
        background: #fffdf8;
        color: #1f2937;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .status {
        min-height: 24px;
        color: #0f766e;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Socratic Whetstone</h1>
      <p id="summary">Loading the Gemini Gem prompt...</p>
      <div class="actions">
        <button id="copy-open" type="button">Copy prompt and open Gemini</button>
        <button id="copy" class="secondary" type="button">Copy only</button>
        <a class="button secondary" href="https://gemini.google.com/gems/create" target="_blank" rel="noreferrer">Open Gemini</a>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <textarea id="prompt" spellcheck="false" aria-label="Gemini Gem prompt"></textarea>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const lang = params.get("lang") === "en" ? "en" : "cn";
      const promptPath = lang === "en"
        ? "../gemini/socratic-whetstone-en.md"
        : "../gemini/socratic-whetstone-cn.md";
      const geminiUrl = "https://gemini.google.com/gems/create";

      const summary = document.getElementById("summary");
      const promptBox = document.getElementById("prompt");
      const status = document.getElementById("status");
      const copyOpen = document.getElementById("copy-open");
      const copyOnly = document.getElementById("copy");

      summary.textContent = lang === "en"
        ? "Copy the English prompt into a new Gemini Gem."
        : "复制中文 prompt，然后粘贴到新的 Gemini Gem instructions 里。";

      async function loadPrompt() {
        const response = await fetch(promptPath, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${promptPath}`);
        }
        promptBox.value = await response.text();
      }

      async function copyPrompt() {
        const text = promptBox.value;
        if (!text.trim()) {
          throw new Error("Prompt is empty.");
        }

        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          promptBox.focus();
          promptBox.select();
          document.execCommand("copy");
        }
      }

      copyOnly.addEventListener("click", async () => {
        try {
          await copyPrompt();
          status.textContent = lang === "en" ? "Prompt copied." : "Prompt 已复制。";
        } catch (error) {
          status.textContent = error.message;
        }
      });

      copyOpen.addEventListener("click", async () => {
        try {
          await copyPrompt();
          status.textContent = lang === "en"
            ? "Prompt copied. Opening Gemini..."
            : "Prompt 已复制，正在打开 Gemini...";
          window.open(geminiUrl, "_blank", "noopener,noreferrer");
        } catch (error) {
          status.textContent = error.message;
        }
      });

      loadPrompt().catch((error) => {
        status.textContent = error.message;
      });
    </script>
  </body>
</html>
